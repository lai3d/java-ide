name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version
      - name: Build
        run: swift build
      # The jdtls / debugger end-to-end tests skip themselves when jdtls isn't installed.
      - name: Test
        run: swift test
      - name: Bundle app
        run: ./scripts/bundle.sh
      - name: Zip app
        run: ditto -c -k --keepParent build/JavaIDE.app build/JavaIDE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: JavaIDE-app
          path: build/JavaIDE.zip
